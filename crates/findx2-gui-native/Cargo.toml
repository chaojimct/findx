[package]
name = "findx2-gui-native"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "FindX2 native GPUI client. Isolated runtime by default; --live is a read-only client of the existing service. Does not replace the WebView GUI."
publish = false

[lib]
name = "findx2_gui_native"
path = "src/lib.rs"

[[bin]]
name = "findx2-gui-native"
path = "src/main.rs"

[dependencies]
encoding_rs = "0.8"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
quick-xml = "0.32"
findx2-ipc = { path = "../findx2-ipc" }
gpui-kit = "=0.9.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Data_Pdf", "Storage", "Storage_Streams", "Foundation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
