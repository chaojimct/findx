[package]
name = "findx2-gui-native"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "FindX2 native GPUI client. Isolated runtime only; does not replace the WebView GUI."
publish = false

[lib]
name = "findx2_gui_native"
path = "src/lib.rs"

[[bin]]
name = "findx2-gui-native"
path = "src/main.rs"

[dependencies]
findx2-ipc = { path = "../findx2-ipc" }
gpui-kit = "=0.9.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync"] }