[package]
name = "findx2-gui-native"
version.workspace = true
edition = "2024"
license.workspace = true
description = "FindX2 native GPUI client. Isolated runtime by default; --live talks to the official FindX2Search service over existing IPC and can manage that named service after explicit confirmation. Official installed native GUI on Windows, Linux and macOS."
publish = false

[lib]
name = "findx2_gui_native"
path = "src/lib.rs"

[[bin]]
name = "findx2-gui-native"
path = "src/main.rs"

[features]
default = ["pinyin"]
pinyin = ["dep:ib-matcher"]

[dependencies]
ib-matcher = { version = "0.4", optional = true, features = ["pinyin"] }
encoding_rs = "0.8"
rusty-leveldb = "=4.0.2"
raw-window-handle = "0.6"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
tar = "0.4"
flate2 = "1"
findx2-ipc = { path = "../findx2-ipc" }
gpui-kit = "=0.9.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# md 富文本渲染：pulldown-cmark 解析 → GPUI 原生绘制（标题/段落/列表/表格）。
pulldown-cmark = "0.13"
semver = "1"
sha2 = "0.10"
ureq = "2.9"
rayon = "1"
rustc-hash = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Data_Pdf", "Storage", "Storage_Streams", "Foundation", "Win32_Foundation", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }
# PDF 真文档渲染：pdfium 光栅（RGBA 直传）+ 字符层，与索引侧同引擎保证坐标同源。
pdfium-render = "0.9"
# docx 富文本自绘：纯 Rust 解析（不启动 Word、不转 PDF/图）。
rdocx = "0.17"
rdocx-oxml = "0.17"
# docx 侧命中匹配（拼音对齐）：轻量纯 Rust，与索引侧同源词表。
pinyin = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
