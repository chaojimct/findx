[package]
name = "findx2-content"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "findx2 全文内容索引 M0 PoC：文本抽取 + tantivy 倒排（与文件名索引解耦）"

[dependencies]
calamine = "0.38"
tantivy = "0.27"
tantivy-jieba = "0.21"
encoding_rs = "0.8"
findx2-core = { path = "../findx2-core" }
parking_lot = "0.12"
serde_json = "1"
pdf-extract = "0.12"
pdfium-render = "0.9"
quick-xml = "0.42"
rayon = "1"
thiserror = "1"
memmap2 = "0.9"
zip = { version = "9", default-features = false, features = ["deflate"] }
pinyin = "0.11.0"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Storage_IndexServer",
] }
