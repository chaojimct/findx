name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native_macos_only:
        description: Native dual-architecture macOS validation only (no publishing)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    if: ${{ !inputs.native_macos_only }}
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux native GUI 与打包依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake pkg-config fakeroot dpkg-dev file \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-xkb-dev libxcb-keysyms1-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-shm0-dev libxcb-randr0-dev libxcb-util-dev libxcb-cursor-dev \
            libwayland-dev libvulkan-dev mesa-vulkan-drivers libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 工作区测试（不含 GUI）
        # 串行：并行跑时 temp 目录 + 超时类测试相互抖动（本地已验证：串行全绿，并行随机红）。
        run: cargo test --workspace --locked --exclude findx2-gui-native -- --test-threads=1

      - name: 编译 GUI
        run: cargo check --locked -p findx2-gui-native

      - name: Linux fixture preferences transaction tests (simulated manager)
        if: runner.os == 'Linux'
        run: python3 scripts/test_unix_service_preferences.py

      - name: Linux packaging helper tests
        if: runner.os == 'Linux'
        run: python3 scripts/test_unix_packaging.py
