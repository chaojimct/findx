name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux native GUI 与打包依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake pkg-config fakeroot dpkg-dev file \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-xkb-dev libxcb-keysyms1-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-shm0-dev libxcb-randr0-dev libxcb-util-dev libxcb-cursor-dev \
            libwayland-dev libvulkan-dev mesa-vulkan-drivers libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 工作区测试（不含已退役的 Tauri GUI crate）
        run: cargo test --workspace --locked --exclude findx2-gui

      - name: 原生 GUI 与更新检测测试
        run: cargo test --locked -p findx2-gui-native

      - name: Linux packaging helper tests
        if: runner.os == 'Linux'
        run: python3 scripts/test_unix_packaging.py

      - name: 编译已退役的 Tauri GUI（不作为正式包入口）
        run: cargo check --locked -p findx2-gui

  frontend:
    name: frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: Typecheck
        working-directory: gui
        run: |
          npm ci
          npx tsc --noEmit
