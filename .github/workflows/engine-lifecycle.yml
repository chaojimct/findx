name: Engine lifecycle safety
on:
  push:
    branches: [release/v2.5.3-engine-durability]
    paths:
      - 'crates/findx2-core/**'
      - 'crates/findx2-windows/**'
      - 'Cargo.lock'
      - 'crates/findx2-service/**'
      - 'crates/findx2-ipc/**'
      - 'crates/findx2-gui-native/**'
      - '.github/workflows/engine-lifecycle.yml'
      - 'scripts/test-engine-native-runtime.ps1'
      - 'installer/transaction-*.psm1'
      - 'installer/upgrade-transaction.ps1'
      - 'scripts/test-owned-ntfs-volume.psm1'
      - 'scripts/test-installer-native.ps1'
      - 'scripts/stage-engine-release.ps1'
      - 'scripts/test-installer-runtime-contract.ps1'
      - 'scripts/test-upgrade-capabilities.ps1'
      - 'scripts/test-ntfs-identity.ps1'
      - 'scripts/test-namespace-scm.ps1'
      - 'installer/FindX.iss'
  workflow_dispatch:
    inputs:
      run_installer_matrix:
        description: 'Explicit immutable-payload matrix; source/blob guards still apply. Not release approval.'
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  windows-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reuse exact successful unchanged engine evidence
        id: engine-change
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin 0d7d1a188bfa4305bcc70ca7fecc1f1bbf850742 --depth=1
          if($LASTEXITCODE){exit $LASTEXITCODE}
          $parent=git diff --name-only 0d7d1a188bfa4305bcc70ca7fecc1f1bbf850742 HEAD -- Cargo.lock Cargo.toml crates installer
          if($LASTEXITCODE){exit $LASTEXITCODE}
          $parentAllowed=@('crates/findx2-core/src/usage.rs','crates/findx2-service/src/run.rs','crates/findx2-windows/src/ntfs_namespace.rs','crates/findx2-windows/src/ntfs_identity.rs','crates/findx2-windows/examples/namespace_index_copy.rs')
          if(@($parent).Count -eq $parentAllowed.Count -and @($parent|Where-Object {$_ -notin $parentAllowed}).Count -eq 0){
            $proof=gh run view 44457772483 --repo chaojimct/findx --json conclusion,headSha|ConvertFrom-Json
            if($LASTEXITCODE -or $proof.conclusion -ne 'success' -or $proof.headSha -cne '0d7d1a188bfa4305bcc70ca7fecc1f1bbf850742'){throw 'Missing prior exact namespace evidence'}
            'parent=true' >> $env:GITHUB_OUTPUT
            'changed=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          git fetch origin eb5e47238dfbf800ce6e08c9f9674f19c66d0abf --depth=1
          if($LASTEXITCODE){exit $LASTEXITCODE}
          $ns=git diff --name-only eb5e47238dfbf800ce6e08c9f9674f19c66d0abf HEAD -- Cargo.lock Cargo.toml crates installer
          if($LASTEXITCODE){exit $LASTEXITCODE}
          $nsAllowed=@('crates/findx2-core/src/usage.rs','crates/findx2-service/src/run.rs','crates/findx2-service/src/watch_health.rs','crates/findx2-windows/src/lib.rs','crates/findx2-windows/src/ntfs_namespace.rs','crates/findx2-windows/src/ntfs_identity.rs')
          if(@($ns).Count -eq $nsAllowed.Count -and @($ns|Where-Object {$_ -notin $nsAllowed}).Count -eq 0){
            $proof=gh run view 44455592859 --repo chaojimct/findx --json conclusion,headSha|ConvertFrom-Json
            if($LASTEXITCODE -or $proof.conclusion -ne 'success' -or $proof.headSha -cne 'eb5e47238dfbf800ce6e08c9f9674f19c66d0abf'){throw 'Missing exact prior targeted evidence'}
            'namespace=true' >> $env:GITHUB_OUTPUT
            'changed=false' >> $env:GITHUB_OUTPUT
            'Only namespace identity/cursor/retained-prefix tests plus actual private-VHD proof; not whole-volume or final payload approval.'
            exit 0
          }
          git fetch origin b952f2734fe043fcb192d354f1502aee600bcf40 --depth=1
          if($LASTEXITCODE){exit $LASTEXITCODE}
          $focused=git diff --name-only b952f2734fe043fcb192d354f1502aee600bcf40 HEAD -- Cargo.lock Cargo.toml crates installer
          if($LASTEXITCODE){exit $LASTEXITCODE}
          $allowed=@('crates/findx2-service/src/ipc_dispatch.rs','crates/findx2-service/src/pipe_server.rs','crates/findx2-service/src/runtime_lifecycle.rs','crates/findx2-windows/src/mft_read.rs','installer/transaction-receipt.psm1')
          if(@($focused).Count -eq $allowed.Count -and @($focused|Where-Object {$_ -notin $allowed}).Count -eq 0){
            $proof=gh run view 44452691069 --repo chaojimct/findx --json conclusion,headSha|ConvertFrom-Json
            if($LASTEXITCODE -or $proof.conclusion -ne 'success' -or $proof.headSha -cne 'b952f2734fe043fcb192d354f1502aee600bcf40'){throw 'Missing prior exact-payload targeted evidence'}
            'focused=true' >> $env:GITHUB_OUTPUT
            'changed=false' >> $env:GITHUB_OUTPUT
            'Targeted capability/MFT identity tests only; prior native8 and same0a18 evidence remain prior-byte evidence, NOT final changed-payload acceptance.'
            exit 0
          }
          git fetch origin aedfa5ca8051704c1137522f67f94603893a3089 --depth=1
          if($LASTEXITCODE){exit $LASTEXITCODE}
          $changed=git diff --name-only aedfa5ca8051704c1137522f67f94603893a3089 HEAD -- Cargo.lock Cargo.toml crates
          if($LASTEXITCODE){exit $LASTEXITCODE}
          $rootFiles=@('crates/findx2-core/src/index.rs','crates/findx2-core/tests/upgrade_candidate.rs')
          $rootOnly=@($changed).Count -eq 2 -and @($changed|Where-Object {$_ -notin $rootFiles}).Count -eq 0
          if($rootOnly){
            if((git rev-parse HEAD:crates/findx2-core/src/index.rs) -cne 'b608551a5c450df5b4e508c8684119ae21316d52'){$rootOnly=$false}
            if((git rev-parse HEAD:crates/findx2-core/tests/upgrade_candidate.rs) -cne '0f3d850449535e67e647ab9c262f5d0adee9e572'){$rootOnly=$false}
          }
          if($rootOnly){'root_only=true' >> $env:GITHUB_OUTPUT}
          if($changed -and -not $rootOnly){'changed=true' >> $env:GITHUB_OUTPUT}else{
            $proof=gh run view 44446796510 --repo chaojimct/findx --json conclusion,headSha | ConvertFrom-Json
            if($LASTEXITCODE -or $proof.conclusion -ne 'success' -or $proof.headSha -cne 'aedfa5ca8051704c1137522f67f94603893a3089'){throw 'Unverified engine evidence'}
            'changed=false' >> $env:GITHUB_OUTPUT
            'Reuse unchanged ACK/IPC/service lifecycle evidence44446796510; any isolated root-path change receives targeted core tests, not a full-payload claim.'
          }
      - uses: dtolnay/rust-toolchain@stable
        if: steps.engine-change.outputs.changed == 'true' || steps.engine-change.outputs.focused == 'true' || steps.engine-change.outputs.namespace == 'true' || steps.engine-change.outputs.parent == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.engine-change.outputs.changed == 'true' || steps.engine-change.outputs.focused == 'true' || steps.engine-change.outputs.namespace == 'true' || steps.engine-change.outputs.parent == 'true'
      - name: Affected parent recovery and real replacement binding tests
        if: steps.engine-change.outputs.parent == 'true'
        shell: pwsh
        run: |
          cargo test --locked -p findx2-windows ntfs_ -- --test-threads=1
          if($LASTEXITCODE){exit $LASTEXITCODE}
          cargo test --locked -p findx2-core --lib namespace_binding -- --test-threads=1
          if($LASTEXITCODE){exit $LASTEXITCODE}
          cargo build --locked -p findx2-service -p findx2-cli
          if($LASTEXITCODE){exit $LASTEXITCODE}
          cargo build --locked -p findx2-core --example verify_persisted_file
          if($LASTEXITCODE){exit $LASTEXITCODE}
          cargo build --locked -p findx2-windows --example namespace_index_copy
          if($LASTEXITCODE){exit $LASTEXITCODE}
      - name: Actual SCM parent permission retry and live journal/index replacement
        if: steps.engine-change.outputs.parent == 'true'
        shell: powershell
        run: ./scripts/test-namespace-scm.ps1 -ServiceExe ./target/debug/findx2-service.exe
      - name: Changed namespace proof and atomic cursor/prefix regressions only
        if: steps.engine-change.outputs.namespace == 'true'
        shell: pwsh
        run: |
          cargo test --locked -p findx2-windows ntfs_ -- --test-threads=1
          if($LASTEXITCODE){exit $LASTEXITCODE}
          cargo test --locked -p findx2-core --lib namespace -- --test-threads=1
          if($LASTEXITCODE){exit $LASTEXITCODE}
          cargo test --locked -p findx2-service namespace_retry_tests -- --test-threads=1
          if($LASTEXITCODE){exit $LASTEXITCODE}
      - name: Actual identity proof on attested private VHD, not whole-volume acceptance
        if: steps.engine-change.outputs.namespace == 'true'
        shell: powershell
        run: ./scripts/test-ntfs-identity.ps1
      - name: Affected authenticated capability and full-FRN MFT identity regressions only
        if: steps.engine-change.outputs.focused == 'true'
        shell: pwsh
        run: |
          cargo test --locked -p findx2-service capabilit -- --test-threads=1 2>&1 | Tee-Object capability-tests.log
          if($LASTEXITCODE){exit $LASTEXITCODE}
          cargo test --locked -p findx2-windows mft_identity_tests -- --test-threads=1 2>&1 | Tee-Object mft-identity-tests.log
          if($LASTEXITCODE){exit $LASTEXITCODE}
      - name: Production negotiation schema and refusal/ordering checks only
        if: steps.engine-change.outputs.namespace != 'true' && steps.engine-change.outputs.parent != 'true'
        shell: powershell
        run: ./scripts/test-upgrade-capabilities.ps1
      - name: Core authoritative admission and actual-writer checkpoint evidence (not runtime ACK)
        if: steps.engine-change.outputs.changed == 'true'
        shell: pwsh
        run: |
          cargo test --locked -p findx2-core --lib -- --test-threads=1 2>&1 | Tee-Object core-checkpoint-fence-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: IPC and actual service shutdown regressions (temporary file fixtures only)
        if: steps.engine-change.outputs.changed == 'true'
        shell: pwsh
        run: |
          cargo test --locked -p findx2-ipc -p findx2-service -- --test-threads=1 2>&1 | Tee-Object engine-lifecycle-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Changed canonical root compatibility regressions only
        if: steps.engine-change.outputs.root_only == 'true'
        shell: pwsh
        run: |
          cargo test --locked -p findx2-core --test upgrade_candidate --test multi_volume_incremental_path --test parent_direct -- --test-threads=1
          if($LASTEXITCODE){exit $LASTEXITCODE}
      - name: Official installer runtime ordering unit regressions (not SCM acceptance)
        if: steps.engine-change.outputs.namespace != 'true' && steps.engine-change.outputs.parent != 'true'
        shell: powershell
        run: ./scripts/test-installer-runtime-contract.ps1
      - name: GUI and CLI compile against actual shared IPC contract
        if: steps.engine-change.outputs.changed == 'true'
        shell: pwsh
        run: |
          cargo check --locked -p findx2-cli -p findx2-gui-native 2>&1 | Tee-Object client-compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual service for isolated native SCM/VHD acceptance
        if: steps.engine-change.outputs.changed == 'true'
        shell: pwsh
        run: |
          cargo build --locked -p findx2-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked -p findx2-cli --bin findx2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked -p findx2-core --example verify_persisted_file
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p findx2-core --example verify_persisted_file -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real native SCM VHD USN backfill and OS writer-failure recovery (no fixture bypass)
        if: steps.engine-change.outputs.changed == 'true'
        shell: pwsh
        run: ./scripts/test-engine-native-runtime.ps1 -ServiceExe ./target/debug/findx2-service.exe
      - name: No force-exit fallback and protocol remains fail-closed
        shell: pwsh
        run: |
          $source = Get-Content crates/findx2-service/src/win_service.rs -Raw
          if ($source -match 'std::process::exit') { throw 'SCM must never force-exit its worker' }
          $dispatch = Get-Content crates/findx2-service/src/ipc_dispatch.rs -Raw
          if ($dispatch -match 'durable_prepare:\s*true') { throw 'Public/unauthenticated dispatch must never advertise a stop capability' }
      - name: Archive bounded A1 test log, not release approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-lifecycle-A1-evidence
          path: |
            core-checkpoint-fence-tests.log
            engine-lifecycle-tests.log
            capability-tests.log
            mft-identity-tests.log
            client-compile.log
            native-runtime-evidence/**
            native-namespace-evidence/**
            ${{ runner.temp }}/FindXUpgradeTest_identity_*/native-identity.*
            ${{ runner.temp }}/FindXUpgradeTest_identity_*/owned-volume.json
          retention-days: 30

  native-package:
    # Old same0a18 is complete. Changed engine/helper needs ONE final converged payload, not a per-microfix rebuild.
    if: github.event_name == 'workflow_dispatch' && inputs.run_installer_matrix == true
    needs: windows-lifecycle
    runs-on: windows-latest
    timeout-minutes: 55
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Native file primitives
        shell: powershell
        run: |
          try { ./scripts/test-transaction-files.ps1 }
          finally {
            # Never recurse through the deliberate junction adversarial fixture.
            # Copy just this fresh runner's result JSON before Rust cache restore.
            $proof=Join-Path $env:RUNNER_TEMP 'FindXUpgradeTest_file-results'
            foreach($fixture in @(Get-ChildItem target -Directory -Filter 'tx-file-tests-*' -ErrorAction SilentlyContinue)){
              $result=Join-Path $fixture.FullName 'results.json'
              if(Test-Path -LiteralPath $result){$out=Join-Path $proof $fixture.Name;$null=New-Item -ItemType Directory -Path $out -Force;Copy-Item -LiteralPath $result -Destination (Join-Path $out 'results.json')}
            }
          }
      - name: Native protected storage and registry regressions
        shell: powershell
        run: ./scripts/test-transaction-platform.ps1
      - name: Obtain hash-pinned published payload without running old installer
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'findx-published252-input'
          New-Item -ItemType Directory -Path $root | Out-Null
          $setup=Join-Path $root 'published-setup.exe'
          Invoke-WebRequest -UseBasicParsing https://github.com/chaojimct/findx/releases/download/v2.5.2/FindX-2.5.2-setup.exe -OutFile $setup
          if((Get-FileHash $setup -Algorithm SHA256).Hash -ne '5766a666f0edcb947f21a9001b5eff0b701686956f65e8a7881a47bd29a9aef1'){throw 'Published setup digest mismatch'}
          $zip=Join-Path $root 'innounp.zip'
          Invoke-WebRequest -UseBasicParsing https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/refs/heads/master/innounp-2/bin/innounp-2.zip -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'f8e45c9676bebc7d7570108ab572673b541fcf7a7d3d24a04319ac6b5315b4e8'){throw 'Pinned public unpacker digest changed; do not run'}
          Expand-Archive $zip -DestinationPath (Join-Path $root 'unpacker')
          & (Join-Path $root 'unpacker/innounp.exe') -x -y ('-d'+(Join-Path $root 'extracted')) $setup
          if($LASTEXITCODE){throw 'Read-only setup extraction failed'}
      - name: Install compiler if absent
        shell: powershell
        run: |
          if(-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")){choco install innosetup -y --no-progress}
      - uses: Swatinem/rust-cache@v2
        with:
          key: durability-253-complete-payload
          cache-on-failure: true
      - name: Verify native COM fixture before expensive build
        shell: powershell
        run: ./scripts/test-installer-fixtures.ps1 -PublishedGui (Join-Path $env:RUNNER_TEMP 'findx-published252-input/extracted/{app}/FindX.exe')
      - uses: actions/download-artifact@v4
        with:
          name: findx-253-rebuilt-engine-candidate-payload
          run-id: 44449891828
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/findx-candidate253-payload
      - name: Verify unchanged payload source and all six artifact hashes
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'findx-candidate253-payload'
          $m=Get-Content (Join-Path $root 'stage-manifest.json') -Raw|ConvertFrom-Json
          if($m.sourceCommit -cne '0a31012c1415a1b1764d55813bfa5ece2f44073d' -or $m.files.Count -ne 6 -or $m.engineUnchanged -ne $false){throw 'Wrong immutable candidate origin'}
          if(@(Get-ChildItem $root -Recurse -File).Count -ne 7 -or @($m.files.name|Select-Object -Unique).Count -ne 6){throw 'Unexpected candidate files'}
          git diff --exit-code 0a31012c1415a1b1764d55813bfa5ece2f44073d HEAD -- installer
          if($LASTEXITCODE){throw 'Installer product changed; cannot compose old11 and new7 evidence'}
          foreach($f in $m.files){$p=Join-Path $root $f.name;if((Get-FileHash $p).Hash -ine $f.sha256 -or (Get-Item $p).Length -ne $f.length){throw 'Reused payload hash mismatch'}}
          # Explicitly NOT the root-fixed current source payload or release approval.
          # Root fix is tested separately above; final rebuilt payload remains mandatory.
      - name: Real official-ISS isolated final-payload package and native SCM matrix
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'findx-published252-input'
          ./scripts/test-installer-native.ps1 -PublishedPayload (Join-Path $root 'extracted/{app}') -CandidatePayload (Join-Path $env:RUNNER_TEMP 'findx-candidate253-payload') -Iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" -EngineCandidate -PayloadSourceCommit '0a31012c1415a1b1764d55813bfa5ece2f44073d' -OnlyCases @('legacy-running-refusal','running253-success','running253-save-refusal','running253-backup-failure','running253-health-rollback','running253-interrupted-recovery','running253-copy-verification-rollback')
      - name: Retain only test-owned evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-engine-installer-test-evidence
          path: |
            ${{ runner.temp }}/FindXUpgradeTest_*/**/*.log
            ${{ runner.temp }}/FindXUpgradeTest_*/**/results.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/journal*.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/failure.txt
            ${{ runner.temp }}/FindXUpgradeTest_gui-*.log
            ${{ runner.temp }}/FindXUpgradeTest_*/**/render-health.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/normal-exit.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/service-health.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/service-status-last.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/owned-volume.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/shortcut-com-diagnostic.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/platform-applied.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/reason.code
            ${{ runner.temp }}/FindXUpgradeTest_*/**/service-uninitialized.flag
            ${{ runner.temp }}/findx-candidate253-payload/stage-manifest.json
            ${{ runner.temp }}/findx-candidate253-payload/resources/component-manifest.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/installer-terminal-receipt.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/terminal-offline-index.log
          if-no-files-found: warn
          retention-days: 7
