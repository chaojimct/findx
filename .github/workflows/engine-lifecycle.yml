name: Engine lifecycle safety
on:
  push:
    branches: [release/v2.5.3-engine-durability]
    paths:
      - 'crates/findx2-core/**'
      - 'Cargo.lock'
      - 'crates/findx2-service/**'
      - 'crates/findx2-ipc/**'
      - 'crates/findx2-gui-native/**'
      - '.github/workflows/engine-lifecycle.yml'
      - 'scripts/test-engine-native-runtime.ps1'
      - 'scripts/test-owned-ntfs-volume.psm1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Core authoritative admission and actual-writer checkpoint evidence (not runtime ACK)
        shell: pwsh
        run: |
          cargo test --locked -p findx2-core --lib -- --test-threads=1 2>&1 | Tee-Object core-checkpoint-fence-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: IPC and actual service shutdown regressions (temporary file fixtures only)
        shell: pwsh
        run: |
          cargo test --locked -p findx2-ipc -p findx2-service -- --test-threads=1 2>&1 | Tee-Object engine-lifecycle-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: GUI and CLI compile against actual shared IPC contract
        shell: pwsh
        run: |
          cargo check --locked -p findx2-cli -p findx2-gui-native 2>&1 | Tee-Object client-compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual service for isolated native SCM/VHD acceptance
        shell: pwsh
        run: |
          cargo build --locked -p findx2-service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked -p findx2-cli --bin findx2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked -p findx2-core --example verify_persisted_file
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p findx2-core --example verify_persisted_file -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real native SCM VHD USN backfill and OS writer-failure recovery (no fixture bypass)
        shell: pwsh
        run: ./scripts/test-engine-native-runtime.ps1 -ServiceExe ./target/debug/findx2-service.exe
      - name: No force-exit fallback and protocol remains fail-closed
        shell: pwsh
        run: |
          $source = Get-Content crates/findx2-service/src/win_service.rs -Raw
          if ($source -match 'std::process::exit') { throw 'SCM must never force-exit its worker' }
          $dispatch = Get-Content crates/findx2-service/src/ipc_dispatch.rs -Raw
          if ($dispatch -match 'durable_prepare:\s*true') { throw 'Receipt cannot be enabled before producer fencing' }
      - name: Archive bounded A1 test log, not release approval
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-lifecycle-A1-evidence
          path: |
            core-checkpoint-fence-tests.log
            engine-lifecycle-tests.log
            client-compile.log
            native-runtime-evidence/**
          retention-days: 30
