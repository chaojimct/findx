name: Production Inno startup regression (sealed runtime, no rebuild)
on:
  push:
    branches: [release/v2.5.3-engine-durability]
    paths: ['.github/workflows/inno-startup.yml']
permissions:
  contents: read
  actions: read
jobs:
  production-startup:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: chaojimct/findx
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse exact setup-only candidate; prior production A/B evidence is immutable
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $d=New-Item -ItemType Directory "$env:RUNNER_TEMP/inno-startup"
          gh run download 44501255780 --name production-inno-startup-regression --dir "$d/reused"
          if($LASTEXITCODE){throw 'Exact prior candidate fetch failed'}
          $p=Join-Path $d 'reused/fixed/FindX-2.5.3-setup.exe'
          if((Get-FileHash $p).Hash -ine '5d3e70ffc341ed6fd467abdec9b1f439c6e47c533adc6982e84876fbb8887722'){throw 'Candidate bytes changed'}
          $old=Get-Content "$d/reused/original.log" -Raw
          $fixed=Get-Content "$d/reused/fixed.log" -Raw
          if($old -notmatch 'Runtime error \(at 28:324\)' -or $old -notmatch 'Type Mismatch'){throw 'Original production reproduction absent'}
          if($fixed -match 'Type Mismatch' -or $fixed -notmatch 'Cross-volume atomic recovery is unsupported'){throw 'Prior fixed production stage not proven'}
          if(Get-Service FindX2Search -ErrorAction SilentlyContinue){throw 'Runner not pristine'}
      - name: Fixed actual production silent install (no TxTestBuild), unchanged runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $d=Join-Path $env:RUNNER_TEMP 'inno-startup'
          $setup=Join-Path $d 'reused/fixed/FindX-2.5.3-setup.exe'
          $app="C:\FindXStartupCandidate-$env:GITHUB_RUN_ID"
          if(Test-Path $app){throw 'Candidate destination already exists'}
          $p=Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TYPE=custom','/COMPONENTS=main,clicfg','/TASKS=',('/DIR="'+$app+'"'),('/LOG="'+$d+'/fixed.log"')) -PassThru
          if(-not $p.WaitForExit(120000)){throw 'Fixed setup timeout; no forced termination'}
          $p.Refresh();$log=Get-Content "$d/fixed.log" -Raw
          if($p.ExitCode -ne 0 -or $log -match 'Type Mismatch|Runtime error|Safe upgrade preparation failed'){throw ('Fixed production startup/install failed: '+$p.ExitCode)}
          if(-not(Test-Path "$app/FindX.exe")){throw 'Did not actually install sealed payload'}
          if(Get-Service FindX2Search -ErrorAction SilentlyContinue){throw 'Excluded service unexpectedly registered'}
          @{originalSha256='9f6663cd13e13d711f98564a2d3e69c218296023162d0abab4a4af62fd17010e';rootCause='PrepareToInstall production GetDateTimeString receives empty strings for Char parameters';onlySourceDelta="GetDateTimeString('yyyymmddhhnnsszzz', #0, #0)";runtimeRebuilt=$false;fixtureOnly=$false;fixedExit=$p.ExitCode;fixedSetupSha256=(Get-FileHash $setup).Hash.ToLowerInvariant();publishable=$false;reason='Diagnostic 2.5.3 candidate only; never overwrite published assets'}|ConvertTo-Json|Set-Content "$d/result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-inno-startup-regression
          path: |
            ${{ runner.temp }}/inno-startup/*.log
            ${{ runner.temp }}/inno-startup/result.json
