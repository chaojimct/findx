name: Canonical installer-only 2.5.3-r1 release
on:
  push:
    branches: [release/v2.5.3-engine-durability]
    paths: ['.github/workflows/installer-r1.yml']
permissions:
  contents: write
  actions: read
jobs:
  canonical-r1:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: chaojimct/findx
    steps:
      - name: Canonical checkout bytes on disposable runner
        shell: powershell
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse exact canonical setup already extracted and real production-installed successfully
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$d=New-Item -ItemType Directory "$env:RUNNER_TEMP/installer-r1"
          if((git rev-parse 'v2.5.3^{commit}') -cne 'f3235307221fc2dd807d0d6c7d1b0d767f0bd987'){throw 'Original tag differs'}
          $j=gh api repos/chaojimct/findx/actions/jobs/135486950685|ConvertFrom-Json
          if($LASTEXITCODE -or $j.head_sha -cne '091e092489020748f33e366d0a69ee2cbe3d5328'){throw 'Wrong canonical source proof'}
          foreach($name in @('Canonical source and exact previously accepted runtime','Setup-only compile, extract and verify every sealed payload and canonical helper','Actual canonical production silent install on isolated same-volume runner')){
            $proof=@($j.steps|Where-Object name -ceq $name);if($proof.Count -ne 1 -or $proof[0].conclusion -cne 'success'){throw ('Canonical proof missing '+$name)}
          }
          gh run download 44502893724 --name findx-253-r1-canonical-official --dir $d
          if($LASTEXITCODE){throw 'Canonical artifact fetch failed'}
          $seal=Get-Content "$d/output/seal-r1.json" -Raw|ConvertFrom-Json
          $setup=Join-Path $d 'output/FindX-2.5.3-r1-setup.exe'
          if($seal.canonicalProductionRun -ne 44502893724 -or $seal.canonicalProductionExit -ne 0 -or -not $seal.embeddedPayloadAndHelpersVerified -or $seal.runtimeRebuilt -or $seal.productVersion -cne '2.5.3' -or (Get-FileHash $setup).Hash -ine $seal.setupSha256){throw 'Canonical artifact/proof mismatch'}
          Move-Item $setup "$d/output/FindX-2.5.3-setup.exe"
          $seal|Add-Member -NotePropertyName preferredAssetName -NotePropertyValue 'FindX-2.5.3-setup.exe'
          $seal|Add-Member -NotePropertyName releaseCommit -NotePropertyValue $env:GITHUB_SHA
          $seal|ConvertTo-Json -Depth 12|Set-Content -Encoding UTF8 "$d/output/seal-r1.json"
          @(((Get-FileHash "$d/output/FindX-2.5.3-setup.exe").Hash.ToLowerInvariant()+'  FindX-2.5.3-setup.exe'),((Get-FileHash "$d/output/seal-r1.json").Hash.ToLowerInvariant()+'  seal-r1.json'))|Set-Content -Encoding ASCII "$d/output/SHA256SUMS-r1.txt"
      - name: Execute actual old and shipped GUI updater version/asset functions without building either GUI
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$d=Join-Path $env:RUNNER_TEMP 'installer-r1'
          $py=@'
          import pathlib,subprocess,re,tomllib
          root=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'installer-r1'/'version-contract'
          (root/'src').mkdir(parents=True)
          lock=tomllib.loads(pathlib.Path('Cargo.lock').read_text())
          version=next(x['version'] for x in lock['package'] if x['name']=='semver')
          (root/'Cargo.toml').write_text('[package]\nname="updater-contract"\nversion="0.0.0"\nedition="2021"\n[dependencies]\nsemver="='+version+'"\n')
          modules=[]
          for name,ref in [('old','v2.5.2'),('shipped','b72219bc844de5eb141bb99a708494c956f53073')]:
            src=subprocess.check_output(['git','show',ref+':crates/findx2-gui-native/src/update_logic.rs']).decode('utf-8')
            names=['version_from_release_tag','is_official_setup_asset_name']
            if name=='shipped':
              names+=['is_official_asset_name','is_forbidden_asset_name']
            funcs=[re.search(r'(?ms)^(?:pub )?fn '+f+r'\b.*?^}',src).group() for f in names]
            if name=='shipped': funcs.insert(0,re.search(r'(?ms)^pub enum UpdatePlatform\b.*?^}',src).group())
            modules.append('mod '+name+'{'+ '\n'.join(funcs)+'}')
          main='fn main(){for v in [old::version_from_release_tag("v2.5.3-r1"),shipped::version_from_release_tag("v2.5.3-r1")]{let v=v.unwrap();assert!(v>semver::Version::parse("2.5.2").unwrap());assert!(v<semver::Version::parse("2.5.3").unwrap());}assert!(old::is_official_setup_asset_name("FindX-2.5.3-setup.exe"));assert!(shipped::is_official_setup_asset_name("FindX-2.5.3-setup.exe"));println!("old252 updates to r1; installed253 does not loop; exact shipped asset functions accept only candidate name");}'
          (root/'src'/'main.rs').write_text('\n'.join(modules)+main)
          '@
          [IO.File]::WriteAllText("$d/updater-contract.py",$py,[Text.UTF8Encoding]::new($false));python "$d/updater-contract.py"
          if($LASTEXITCODE){throw 'Exact updater source extraction failed'}
          cargo run --quiet --manifest-path "$d/version-contract/Cargo.toml"
          if($LASTEXITCODE){throw 'Actual updater version/asset contract failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findx-253-r1-canonical-official
          path: |
            ${{ runner.temp }}/installer-r1/output/*
            ${{ runner.temp }}/installer-r1/canonical-production.log
      - name: Publish only absent revision tag/release, select as latest, never overwrite 2.5.3
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';$d=Join-Path $env:RUNNER_TEMP 'installer-r1';$tag='v2.5.3-r1'
          $releases=gh release list --limit 100 --json tagName|ConvertFrom-Json
          if($LASTEXITCODE -or @($releases|Where-Object tagName -ceq $tag).Count){throw 'Revision exists or uncertain; no overwrite'}
          $remote=git ls-remote --tags origin "refs/tags/$tag"
          if($LASTEXITCODE -or $remote){throw 'Revision tag exists or uncertain; no overwrite'}
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a $tag $env:GITHUB_SHA -m 'Installer-only r1: production GetDateTimeString Char fix; sealed GUI and engine remain 2.5.3'
          if($LASTEXITCODE){throw 'New tag failed'}
          git push origin "refs/tags/$tag"
          if($LASTEXITCODE){throw 'New tag push failed'}
          $notes=@'
          Installer-only revision r1. GUI, CLI and engine remain the exact accepted 2.5.3 binaries; this is NOT product 2.5.4.
          Fixes a production-only Inno PrepareToInstall Type Mismatch before the upgrade transaction: GetDateTimeString Char separators now use #0 instead of empty strings. Canonical helpers, six runtime files and embedded manifest independently verified; actual non-fixture /VERYSILENT installation passed on isolated Windows.
          Windows 2.5.2 users: check for updates again to download FindX-2.5.3-setup.exe. Running legacy services without protocol2 remain safely refused before STOP; no forced shutdown. Existing installed 2.5.3 binaries do not need replacement solely for this installer fix.
          The prior v2.5.3 release and assets are preserved unchanged. This revision is the preferred update download. Install manually; no automatic installation.
          '@
          [IO.File]::WriteAllText("$d/notes.txt",$notes,[Text.UTF8Encoding]::new($false))
          gh release create $tag "$d/output/FindX-2.5.3-setup.exe" "$d/output/SHA256SUMS-r1.txt" "$d/output/seal-r1.json" --verify-tag --latest --prerelease=false --title 'FindX 2.5.3 — installer revision r1' --notes-file "$d/notes.txt"
          if($LASTEXITCODE){throw 'Release failed; no overwrite retry'}
          $latest=gh api repos/chaojimct/findx/releases/latest|ConvertFrom-Json
          if($LASTEXITCODE -or $latest.tag_name -cne $tag -or $latest.draft -or $latest.prerelease){throw 'Latest contract differs'}
          $assets=@($latest.assets|Where-Object{$_.name.ToLowerInvariant().StartsWith('findx-') -and $_.name.ToLowerInvariant().EndsWith('-setup.exe')})
          if($assets.Count -ne 1 -or $assets[0].name -cne 'FindX-2.5.3-setup.exe'){throw 'Updater ambiguous setup selection'}
          $latest|ConvertTo-Json -Depth 12|Set-Content "$d/latest.json"
          Invoke-WebRequest -UseBasicParsing $assets[0].browser_download_url -OutFile "$d/external-download.exe"
          if((Get-FileHash "$d/external-download.exe").Hash -cne (Get-FileHash "$d/output/FindX-2.5.3-setup.exe").Hash){throw 'Public download differs'}
