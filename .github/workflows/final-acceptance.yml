name: Final current-engine immutable-GUI acceptance
on:
  push:
    branches: [release/v2.5.3-engine-durability]
    paths: ['.github/workflows/final-acceptance.yml', 'scripts/final-*', 'scripts/stage-final-payload.ps1']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  combined:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: durability-253-complete-payload
          cache-on-failure: true
      - uses: actions/download-artifact@v4
        with:
          name: findx-253-final-engine-E10D-gui-payload
          run-id: 44475535981
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/findx-final253-payload
      - name: Verify and reuse exact already-built runtime; NO engine or GUI build
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source='0157cca03ea4e24c803624da968ee741393ba1b1'
          foreach($p in @('crates','gui','installer','Cargo.toml','Cargo.lock','scripts/check_release.py')){
            $current=git rev-parse "HEAD:$p";if($LASTEXITCODE){throw 'Current source missing'}
            $built=git rev-parse "${source}:$p";if($LASTEXITCODE -or $current -cne $built){throw "Runtime source changed: $p"}
          }
          $root="$env:RUNNER_TEMP/findx-final253-payload"
          if((Get-FileHash "$root/stage-manifest.json").Hash -cne '9D423F2A1ABBF78B6A78AC4B0AAD5020E935727360104C1D2EAD09A21B2D9AA8'){throw 'Original stage manifest changed'}
          $m=Get-Content "$root/stage-manifest.json" -Raw|ConvertFrom-Json
          if($m.sourceCommit -cne $source -or $m.engineUnchanged -ne $false -or @($m.files).Count -ne 6){throw 'Not exact current payload'}
          if(@(Get-ChildItem $root -Recurse -File).Count -ne 7){throw 'Extra/missing payload file'}
          foreach($f in $m.files){$p=Join-Path $root $f.name;if((Get-FileHash $p).Hash.ToLowerInvariant() -cne $f.sha256 -or (Get-Item $p).Length -ne $f.length){throw 'Payload hash/length changed'}}
          $null=New-Item -ItemType Directory target/release -Force
          foreach($f in @('findx2-service.exe','findx2.exe','fx.exe')){Copy-Item (Join-Path $root $f) (Join-Path 'target/release' $f)}
      - name: Build existing data-only legacy generator after preserving runtime artifacts
        id: generator
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo build --locked --release -p findx2-core --example verify_persisted_file --example namespace_index_copy --target-dir target --jobs 2
          if($LASTEXITCODE){exit $LASTEXITCODE}
          $null=New-Item -ItemType Directory scripts/gui-compat-tests/examples -Force
          Copy-Item scripts/final-legacy-export.rs scripts/gui-compat-tests/examples/final-legacy-export.rs
          cargo build --locked --release --manifest-path scripts/gui-compat-tests/Cargo.toml --example final-legacy-export --target-dir target --jobs 2
          if($LASTEXITCODE){exit $LASTEXITCODE}
          Copy-Item target/release/examples/final-legacy-export.exe target/release/final-legacy-export.exe
      - name: Combined real two-volume backfill durability USN owner and official GUI campaign
        id: native
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && steps.generator.outcome == 'success' }}
        shell: powershell
        run: ./scripts/final-native-campaign.ps1 -Payload "$env:RUNNER_TEMP/findx-final253-payload"
      - name: Reuse native parent journal epoch recovery harness on exact newly built engine bytes
        id: namespace
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        shell: powershell
        run: |
          $null=New-Item -ItemType Directory target/debug/examples -Force
          foreach($f in @('findx2-service.exe','findx2.exe','fx.exe')){Copy-Item (Join-Path 'target/release' $f) (Join-Path 'target/debug' $f)}
          foreach($f in @('verify_persisted_file.exe','namespace_index_copy.exe')){Copy-Item (Join-Path 'target/release/examples' $f) (Join-Path 'target/debug/examples' $f)}
          foreach($f in @('findx2-service.exe','findx2.exe','fx.exe')){if((Get-FileHash (Join-Path 'target/debug' $f)).Hash -cne (Get-FileHash (Join-Path 'target/release' $f)).Hash){throw 'Harness must consume exact release bytes'}}
          ./scripts/test-namespace-scm.ps1 -ServiceExe ./target/debug/findx2-service.exe
      - name: Obtain hash-pinned published payload without running installer
        id: old
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'findx-published252-input'
          New-Item -ItemType Directory -Path $root | Out-Null
          $setup=Join-Path $root 'published-setup.exe'
          Invoke-WebRequest -UseBasicParsing https://github.com/chaojimct/findx/releases/download/v2.5.2/FindX-2.5.2-setup.exe -OutFile $setup
          if((Get-FileHash $setup -Algorithm SHA256).Hash -ne '5766a666f0edcb947f21a9001b5eff0b701686956f65e8a7881a47bd29a9aef1'){throw 'Published setup digest mismatch'}
          $zip=Join-Path $root 'innounp.zip'
          Invoke-WebRequest -UseBasicParsing https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/refs/heads/master/innounp-2/bin/innounp-2.zip -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'f8e45c9676bebc7d7570108ab572673b541fcf7a7d3d24a04319ac6b5315b4e8'){throw 'Pinned public unpacker digest changed; do not run'}
          Expand-Archive $zip -DestinationPath (Join-Path $root 'unpacker')
          & (Join-Path $root 'unpacker/innounp.exe') -x -y ('-d'+(Join-Path $root 'extracted')) $setup
          if($LASTEXITCODE){throw 'Read-only setup extraction failed'}
      - name: Only failed actual final-payload save-refusal retry; reuse existing 17 passed cases
        id: installer
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && steps.old.outcome == 'success' }}
        shell: powershell
        run: |
          if(-not(Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")){choco install innosetup -y --no-progress}
          ./scripts/test-installer-native.ps1 -PublishedPayload "$env:RUNNER_TEMP/findx-published252-input/extracted/{app}" -CandidatePayload "$env:RUNNER_TEMP/findx-final253-payload" -Iscc "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" -EngineCandidate -PayloadSourceCommit '0157cca03ea4e24c803624da968ee741393ba1b1' -OnlyCases @('running253-save-refusal')
      - name: Archive only exact payload and bounded independent results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findx-253-final-combined-acceptance
          path: |
            final-parent-benchmark.log
            final-native-evidence/**
            native-namespace-evidence/**
            ${{ runner.temp }}/FindXUpgradeTest_*/results.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/journal*.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/failure.txt
            ${{ runner.temp }}/FindXUpgradeTest_*/**/render-health.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/normal-exit.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/service-health.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/service-status-last.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/*receipt*.json
          retention-days: 30
