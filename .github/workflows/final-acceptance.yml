name: Final current-engine immutable-GUI acceptance
on:
  push:
    branches: [release/v2.5.3-engine-durability]
    paths: ['.github/workflows/final-acceptance.yml', 'scripts/final-*', 'scripts/stage-final-payload.ps1']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  combined:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: durability-253-complete-payload
          cache-on-failure: true
      - uses: actions/download-artifact@v4
        with:
          name: findx-253-stat-settled-E10D-final-payload
          run-id: 44481898941
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/findx-final253-payload
      - uses: actions/download-artifact@v4
        with:
          name: findx-253-gui-candidate-migration
          run-id: 44468255654
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/final-gui-input
      - name: One incremental service-only build and finalizer lifetime regressions
        shell: pwsh
        run: |
          $root="$env:RUNNER_TEMP/findx-final253-payload"
          if((Get-FileHash "$root/stage-manifest.json").Hash -cne '094245F0A854DD4942BFD146B2E172A03516C917F8EAE39D0397AF67E95E2116'){throw 'Old CLI input manifest changed'}
          $m=Get-Content "$root/stage-manifest.json" -Raw|ConvertFrom-Json
          foreach($f in $m.files){$p=Join-Path $root $f.name;if((Get-FileHash $p).Hash.ToLowerInvariant() -cne $f.sha256 -or (Get-Item $p).Length -ne $f.length){throw 'Input payload hash changed'}}
          $null=New-Item -ItemType Directory target/release -Force
          foreach($f in @('findx2.exe','fx.exe')){Copy-Item (Join-Path $root $f) (Join-Path 'target/release' $f)}
          Remove-Item -LiteralPath $root -Recurse
          cargo test --locked -p findx2-service metadata_finalizer_ -- --nocapture --test-threads=1
          if($LASTEXITCODE){exit $LASTEXITCODE}
          cargo test --locked -p findx2-service runtime_real_metadata_pipeline_and_queued_child_finish_while_closing -- --nocapture --test-threads=1
          if($LASTEXITCODE){exit $LASTEXITCODE}
          cargo build --locked --release -p findx2-service --bin findx2-service --target-dir target --jobs 2
          if($LASTEXITCODE){exit $LASTEXITCODE}
      - name: Pin exact six files with new service and unchanged GUI CLI origins
        id: stage
        shell: pwsh
        run: ./scripts/stage-final-payload.ps1 -GuiRoot "$env:RUNNER_TEMP/final-gui-input" -Destination "$env:RUNNER_TEMP/findx-final253-payload" -ReusedCliCommit '0157cca03ea4e24c803624da968ee741393ba1b1' -ReusedCliRun 44475535981
      - uses: actions/upload-artifact@v4
        with:
          name: findx-253-finalizer-settled-E10D-final-payload
          path: ${{ runner.temp }}/findx-final253-payload/**
          retention-days: 30
      - name: Build existing data-only legacy generator after preserving runtime artifacts
        id: generator
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo build --locked --release -p findx2-core --example verify_persisted_file --target-dir target --jobs 2
          if($LASTEXITCODE){exit $LASTEXITCODE}
          $null=New-Item -ItemType Directory scripts/gui-compat-tests/examples -Force
          Copy-Item scripts/final-legacy-export.rs scripts/gui-compat-tests/examples/final-legacy-export.rs
          cargo build --locked --release --manifest-path scripts/gui-compat-tests/Cargo.toml --example final-legacy-export --target-dir target --jobs 2
          if($LASTEXITCODE){exit $LASTEXITCODE}
          Copy-Item target/release/examples/final-legacy-export.exe target/release/final-legacy-export.exe
      - name: Combined real two-volume backfill durability USN owner and official GUI campaign
        id: native
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && steps.generator.outcome == 'success' }}
        shell: powershell
        run: ./scripts/final-native-campaign.ps1 -Payload "$env:RUNNER_TEMP/findx-final253-payload" -OnlyRemaining
      - name: Obtain hash-pinned published payload without running installer
        id: old
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'findx-published252-input'
          New-Item -ItemType Directory -Path $root | Out-Null
          $setup=Join-Path $root 'published-setup.exe'
          Invoke-WebRequest -UseBasicParsing https://github.com/chaojimct/findx/releases/download/v2.5.2/FindX-2.5.2-setup.exe -OutFile $setup
          if((Get-FileHash $setup -Algorithm SHA256).Hash -ne '5766a666f0edcb947f21a9001b5eff0b701686956f65e8a7881a47bd29a9aef1'){throw 'Published setup digest mismatch'}
          $zip=Join-Path $root 'innounp.zip'
          Invoke-WebRequest -UseBasicParsing https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/refs/heads/master/innounp-2/bin/innounp-2.zip -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'f8e45c9676bebc7d7570108ab572673b541fcf7a7d3d24a04319ac6b5315b4e8'){throw 'Pinned public unpacker digest changed; do not run'}
          Expand-Archive $zip -DestinationPath (Join-Path $root 'unpacker')
          & (Join-Path $root 'unpacker/innounp.exe') -x -y ('-d'+(Join-Path $root 'extracted')) $setup
          if($LASTEXITCODE){throw 'Read-only setup extraction failed'}
      - name: Only prepare STOP success and write-failure refusal integration; reuse prior unaffected eight-case evidence
        id: installer
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && steps.old.outcome == 'success' }}
        shell: powershell
        run: |
          if(-not(Test-Path "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe")){choco install innosetup -y --no-progress}
          ./scripts/test-installer-native.ps1 -PublishedPayload "$env:RUNNER_TEMP/findx-published252-input/extracted/{app}" -CandidatePayload "$env:RUNNER_TEMP/findx-final253-payload" -Iscc "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" -EngineCandidate -PayloadSourceCommit $env:GITHUB_SHA -OnlyCases @('running253-success','running253-save-refusal')
      - name: Archive only exact payload and bounded independent results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findx-253-final-combined-acceptance
          path: |
            final-parent-benchmark.log
            final-native-evidence/**
            native-namespace-evidence/**
            ${{ runner.temp }}/FindXUpgradeTest_*/results.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/journal*.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/failure.txt
            ${{ runner.temp }}/FindXUpgradeTest_*/**/render-health.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/normal-exit.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/service-health.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/service-status-last.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/*receipt*.json
            ${{ runner.temp }}/FindXUpgradeTest_*/**/save-repair-observed.json
          retention-days: 30
