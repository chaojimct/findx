name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 2.3.0）"
        required: true
        default: "2.5.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"
          echo "version=$V"
      - name: Validate version and upgrade release gates
        run: python scripts/check_release.py --expected-version "${{ steps.ver.outputs.VERSION }}" --require-ready

  build-windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust target cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 单独 release 编译 CLI / 服务（保证 stage 一定能拿到 findx2.exe / fx.exe / findx2-service.exe）
        shell: pwsh
        run: |
          Remove-Item Env:CARGO_TARGET_DIR -ErrorAction SilentlyContinue
          cargo build --release -p findx2-cli -p findx2-service
          $rel = Join-Path $env:GITHUB_WORKSPACE "target\release"
          foreach ($f in @("findx2.exe","fx.exe","findx2-service.exe")) {
            $p = Join-Path $rel $f
            if (-not (Test-Path $p)) { throw "release 编译后仍缺少: $p" }
            Write-Host "OK: $p"
          }

      - name: Build native Windows GUI (pinyin enabled)
        shell: pwsh
        run: |
          Remove-Item Env:CARGO_TARGET_DIR -ErrorAction SilentlyContinue
          cargo build --release -p findx2-gui-native --features pinyin
          if (-not (Test-Path target/release/findx2-gui-native.exe)) { throw "Missing native GUI" }

      - name: 安装 Inno Setup 并制包
        shell: pwsh
        run: |
          choco install innosetup -y
          $v = "${{ needs.meta.outputs.version }}"
          $ws = $env:GITHUB_WORKSPACE
          $stageScript = Join-Path $ws "installer\stage-inno.ps1"
          & $stageScript -RepoRoot $ws
          $stage = Join-Path $ws "installer\stage"
          foreach ($req in @("FindX.exe","findx2.exe","fx.exe","findx2-service.exe")) {
            $p = Join-Path $stage $req
            if (-not (Test-Path $p)) {
              Write-Host "---- installer\stage 内容 ----"
              Get-ChildItem $stage -Force -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
              throw "stage 缺少 $req，安装包将不可用。"
            }
            Write-Host "OK stage: $p"
          }
          $stageAbs = (Resolve-Path $stage).Path
          $iscc = "$(${env:ProgramFiles(x86)})\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "未找到 ISCC，请确认 choco innosetup 安装成功。" }
          $iss = Join-Path $ws "installer\FindX.iss"
          $publishArg = '/DPublishDir=' + ($stageAbs.Replace('\', '/'))
          & $iscc /DUpgradeGatesApproved=1 /DMyAppVersion=$v $publishArg $iss

      - name: Collect artifacts
        shell: pwsh
        run: |
          $d = "$env:GITHUB_WORKSPACE\dist"
          if (-not (Get-ChildItem $d -Filter "FindX-*-setup.exe" -File -ErrorAction SilentlyContinue)) {
            Get-ChildItem $d -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "dist: $($_.Name)" }
            Write-Error "未找到 dist 下的 FindX-*-setup.exe，请检查 Inno 是否成功。"
            exit 1
          }
          Get-ChildItem $d -Filter "FindX-*-setup.exe" -File | ForEach-Object { Write-Host "artifact: $($_.FullName)" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: findx-windows
          path: dist/*

  build-macos:
    needs: meta
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust target cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build official native macOS app and unsigned dmg
        run: bash installer/macos/pack-macos.sh --version "${{ needs.meta.outputs.version }}" --out "$GITHUB_WORKSPACE/dist"

      - name: Guard against Windows setup names
        run: |
          set -euo pipefail
          if compgen -G "$GITHUB_WORKSPACE/dist/FindX-*-setup.exe" > /dev/null; then
            echo "macOS job must not emit FindX-*-setup.exe" >&2
            ls -la "$GITHUB_WORKSPACE/dist"
            exit 1
          fi
          test -n "$(ls "$GITHUB_WORKSPACE/dist"/FindX-*-macos-*.dmg 2>/dev/null)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: findx-macos
          path: dist/*

  build-linux:
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux native GUI 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake pkg-config fakeroot dpkg-dev file \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-xkb-dev libxcb-keysyms1-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-shm0-dev libxcb-randr0-dev libxcb-util-dev libxcb-cursor-dev \
            libwayland-dev libvulkan-dev mesa-vulkan-drivers libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust target cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build official native Linux deb and tarball
        run: bash installer/unix/pack-linux.sh --version "${{ needs.meta.outputs.version }}" --out "$GITHUB_WORKSPACE/dist"

      - name: Guard against Windows setup names and Tauri leftovers
        run: |
          set -euo pipefail
          if compgen -G "$GITHUB_WORKSPACE/dist/FindX-*-setup.exe" > /dev/null; then
            echo "Linux job must not emit FindX-*-setup.exe" >&2
            ls -la "$GITHUB_WORKSPACE/dist"
            exit 1
          fi
          test -f "$GITHUB_WORKSPACE/dist/FindX-${{ needs.meta.outputs.version }}-linux-x64.deb"
          test -f "$GITHUB_WORKSPACE/dist/FindX-${{ needs.meta.outputs.version }}-linux-x64.tar.gz"
          python3 scripts/test_unix_packaging.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: findx-linux
          path: dist/*

  publish:
    needs: [meta, build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: findx-*
          merge-multiple: true
          path: dist

      - name: Validate official asset names (protect Windows native setup)
        run: python3 scripts/check_release_assets.py --dist dist --expected-version "${{ needs.meta.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FindX ${{ needs.meta.outputs.version }}
          files: dist/*
          generate_release_notes: true
