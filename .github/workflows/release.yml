name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 2.3.0）"
        required: true
        default: "2.5.0"

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$V" >> "$GITHUB_OUTPUT"
          echo "version=$V"
      - name: Validate version and upgrade release gates
        run: python scripts/check_release.py --expected-version "${{ steps.ver.outputs.VERSION }}" --require-ready

  build-windows:
    if: needs.meta.outputs.version != '2.5.3'
    needs: meta
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust target cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 单独 release 编译 CLI / 服务（保证 stage 一定能拿到 findx2.exe / fx.exe / findx2-service.exe）
        shell: pwsh
        run: |
          Remove-Item Env:CARGO_TARGET_DIR -ErrorAction SilentlyContinue
          cargo build --release -p findx2-cli -p findx2-service
          $rel = Join-Path $env:GITHUB_WORKSPACE "target\release"
          foreach ($f in @("findx2.exe","fx.exe","findx2-service.exe")) {
            $p = Join-Path $rel $f
            if (-not (Test-Path $p)) { throw "release 编译后仍缺少: $p" }
            Write-Host "OK: $p"
          }

      - name: Build native Windows GUI (pinyin enabled)
        shell: pwsh
        run: |
          Remove-Item Env:CARGO_TARGET_DIR -ErrorAction SilentlyContinue
          cargo build --release -p findx2-gui-native --features pinyin
          if (-not (Test-Path target/release/findx2-gui-native.exe)) { throw "Missing native GUI" }

      - name: 安装 Inno Setup 并制包
        shell: pwsh
        run: |
          choco install innosetup -y
          $v = "${{ needs.meta.outputs.version }}"
          $ws = $env:GITHUB_WORKSPACE
          $stageScript = Join-Path $ws "installer\stage-inno.ps1"
          & $stageScript -RepoRoot $ws
          $stage = Join-Path $ws "installer\stage"
          foreach ($req in @("FindX.exe","findx2.exe","fx.exe","findx2-service.exe")) {
            $p = Join-Path $stage $req
            if (-not (Test-Path $p)) {
              Write-Host "---- installer\stage 内容 ----"
              Get-ChildItem $stage -Force -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
              throw "stage 缺少 $req，安装包将不可用。"
            }
            Write-Host "OK stage: $p"
          }
          $stageAbs = (Resolve-Path $stage).Path
          $iscc = "$(${env:ProgramFiles(x86)})\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "未找到 ISCC，请确认 choco innosetup 安装成功。" }
          $iss = Join-Path $ws "installer\FindX.iss"
          $publishArg = '/DPublishDir=' + ($stageAbs.Replace('\', '/'))
          & $iscc /DUpgradeGatesApproved=1 /DMyAppVersion=$v $publishArg $iss

      - name: Collect artifacts
        shell: pwsh
        run: |
          $d = "$env:GITHUB_WORKSPACE\dist"
          if (-not (Get-ChildItem $d -Filter "FindX-*-setup.exe" -File -ErrorAction SilentlyContinue)) {
            Get-ChildItem $d -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "dist: $($_.Name)" }
            Write-Error "未找到 dist 下的 FindX-*-setup.exe，请检查 Inno 是否成功。"
            exit 1
          }
          Get-ChildItem $d -Filter "FindX-*-setup.exe" -File | ForEach-Object { Write-Host "artifact: $($_.FullName)" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: findx-windows
          path: dist/*

  build-macos:
    if: needs.meta.outputs.version != '2.5.3'
    needs: meta
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust target cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: 构建 Tauri（app + dmg，含 CLI/服务 sidecar）
        working-directory: gui
        run: npm run tauri build

      - name: 校验 .app 内 sidecar 可执行且非占位
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find target/release/bundle -name 'FindX.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "未找到 FindX.app"
            find target/release/bundle -maxdepth 5 -print || true
            exit 1
          fi
          echo "APP=$APP"
          found=0
          while IFS= read -r p; do
            sz=$(stat -f%z "$p")
            echo "sidecar $p size=$sz"
            if [ "$sz" -lt 100000 ]; then
              echo "sidecar 过小，仍是占位文件: $p"
              exit 1
            fi
            chmod +x "$p" || true
            found=$((found + 1))
          done < <(find "$APP" \( -name findx2 -o -name fx -o -name findx2-service \) -type f)
          if [ "$found" -lt 3 ]; then
            echo "期望至少 3 个 sidecar，实际 $found。Contents 目录："
            find "$APP/Contents" -type f | head -80
            exit 1
          fi
          test -x "$APP/Contents/MacOS/FindX" || test -x "$APP/Contents/MacOS/findx2-gui" || {
            echo "未找到主程序 MacOS/FindX"
            ls -la "$APP/Contents/MacOS" || true
            exit 1
          }

      - name: Collect artifacts
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          dmg=(target/release/bundle/dmg/*.dmg)
          if [ ${#dmg[@]} -eq 0 ]; then
            echo "未找到 dmg，bundle 目录："
            find target/release/bundle -maxdepth 3 -type f -print || true
            exit 1
          fi
          cp "${dmg[@]}" dist/
          case "$(uname -m)" in
            arm64|aarch64) ARCH=aarch64 ;;
            x86_64) ARCH=x64 ;;
            *) ARCH="$(uname -m)" ;;
          esac
          tar -C target/release -czf "dist/FindX-${VERSION}-macos-${ARCH}-cli.tar.gz" findx2 fx findx2-service
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: findx-macos
          path: dist/*

  build-linux:
    if: needs.meta.outputs.version != '2.5.3'
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libfuse2t64 \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust target cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: 构建 Tauri（deb + AppImage，含 CLI/服务 sidecar）
        working-directory: gui
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri build

      - name: Collect artifacts
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          found=0
          for f in target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage; do
            cp "$f" dist/
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "未找到 deb/AppImage，bundle 目录："
            find target/release/bundle -maxdepth 4 -type f -print || true
            exit 1
          fi
          tar -C target/release -czf "dist/FindX-${VERSION}-linux-x64-cli.tar.gz" findx2 fx findx2-service
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: findx-linux
          path: dist/*

  sealed-windows:
    needs: meta
    if: needs.meta.outputs.version == '2.5.3'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch explicitly pinned runtime and independent raw proofs, no rebuild
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $lock=Get-Content release/2.5.3-seal-lock.json -Raw|ConvertFrom-Json
          if($lock.schema -cne 'rebuilt-engine-composite-v2'){throw 'New final composite proof lock required'}
          gh run download $lock.testedRun --repo chaojimct/findx --name $lock.payloadArtifact --dir "$env:RUNNER_TEMP/sealed-payload"
          if($LASTEXITCODE){throw 'Exact tested payload download failed'}
          $done=@{}
          foreach($p in $lock.proofs){$key=[string]$p.run+':'+$p.artifact;if($done.ContainsKey($key)){continue};$done[$key]=$true
            if($p.artifact -ceq 'repository-evidence'){
              if($p.sourcePath -cnotmatch '^release/evidence/[A-Za-z0-9_.-]+$'){throw 'Invalid committed evidence path'}
              $dir=Join-Path "$env:RUNNER_TEMP/sealed-evidence" ([string]$done.Count);$null=New-Item -ItemType Directory $dir
              Copy-Item -LiteralPath $p.sourcePath -Destination (Join-Path $dir $p.fileName);continue
            }
            gh run download $p.run --repo chaojimct/findx --name $p.artifact --dir (Join-Path "$env:RUNNER_TEMP/sealed-evidence" ([string]$done.Count))
            if($LASTEXITCODE){throw 'Pinned independent raw proof download failed'}
          }
      - name: Install packaging compiler and hash-pinned read-only extractor only
        shell: powershell
        run: |
          if(-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")){choco install innosetup -y --no-progress;if($LASTEXITCODE){throw 'ISCC installation failed'}}
          $zip=Join-Path $env:RUNNER_TEMP 'innounp.zip'
          Invoke-WebRequest -UseBasicParsing https://raw.githubusercontent.com/jrathlev/InnoUnpacker-Windows-GUI/refs/heads/master/innounp-2/bin/innounp-2.zip -OutFile $zip
          if((Get-FileHash $zip).Hash -ine 'f8e45c9676bebc7d7570108ab572673b541fcf7a7d3d24a04319ac6b5315b4e8'){throw 'Read-only extractor digest changed'}
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP/innounp"
      - name: Approved official setup from sealed bytes; extract and verify every embedded hash
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/pack-sealed-release.ps1 -PayloadRoot "$env:RUNNER_TEMP/sealed-payload" -EvidenceRoot "$env:RUNNER_TEMP/sealed-evidence" -OutputRoot "$env:RUNNER_TEMP/sealed-production-output" -Production -Iscc "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" -Extractor "$env:RUNNER_TEMP/innounp/innounp.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: findx-windows-sealed
          path: ${{ runner.temp }}/sealed-production-output/official/*

  publish:
    needs: [meta, build-windows, build-macos, build-linux, sealed-windows]
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') && needs.meta.result == 'success' &&
      ((needs.meta.outputs.version == '2.5.3' && needs.sealed-windows.result == 'success') ||
       (needs.meta.outputs.version != '2.5.3' && needs.build-windows.result == 'success' && needs.build-macos.result == 'success' && needs.build-linux.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.meta.outputs.version == '2.5.3' && 'findx-windows-sealed' || 'findx-*' }}
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        if: needs.meta.outputs.version != '2.5.3'
        uses: softprops/action-gh-release@v2
        with:
          name: FindX ${{ needs.meta.outputs.version }}
          files: dist/*
          generate_release_notes: true

      - name: Create new 2.5.3 Release without overwrite
        if: needs.meta.outputs.version == '2.5.3'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v2.5.3"
          # gh release create fails when the Release exists; never upload --clobber.
          gh release create v2.5.3 dist/FindX-2.5.3-setup.exe dist/SHA256SUMS.txt dist/seal.json --verify-tag --title "FindX 2.5.3" --notes "Native GUI and rebuilt durability-safe engine; exact sealed payload with component-scoped acceptance provenance in seal.json. Running legacy 2.5.2 without protocol2 is refused before STOP; no forced shutdown. Install manually; no automatic installation."
